[project]
name = "jq-docs-mcp"
version = "1.0.0"
description = "MCP server for querying JoinQuant (聚宽) API documentation — 221 functions, 2479 table columns"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = ["joinquant", "mcp", "quant", "trading", "api-docs"]
dependencies = [
    "fastmcp>=3.1.1",
]

[project.scripts]
jq-docs-mcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["server.py", "jq_knowledge.db"]

[tool.hatch.build.targets.wheel.force-include]
"jq_knowledge.db" = "jq_knowledge.db"

[tool.hatch.build.targets.sdist]
only-include = ["server.py", "jq_knowledge.db", "pyproject.toml", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest",
    "playwright",
    "beautifulsoup4",
    "lxml",
    "python-dotenv",
    "rich",
]
